# Mesurer l'impact de la page d'accueil et de l'image Docker (TP 5 & TP 6).
name: Measures

on:
  schedule:
    # Chaque lundi matin à 8h00 UTC (mesures chaque semaine)
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the application
        env:
          CSP: report-only
        run: |
          npm start &
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent http://localhost:3000/health
      - name: EcoIndex of the home page
        uses: ythirion/greenit-analysis-action@v0.1.2
        with:
          min-ecoindex: "80" # l'objectif de l'équipe : au moins 80 sur 100
          retention-days: "7"
      - name: Build the image
        if: always()
        run: docker build -t circuitcourt:measure .
      - name: Weight of the artifacts
        if: always()
        run: npm run weight -- circuitcourt:measure 300
