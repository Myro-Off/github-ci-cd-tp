name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "deploy/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gitleaks
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Start the application
        run: |
          npm start &
          curl --retry 10 --retry-connrefused --retry-delay 1 --silent http://localhost:3000/health
      - name: Mozilla Observatory (60/100 at least, grade C+)
        run: npm run observatory -- circuitcourt.localhost:3000 60

  sonar:
    needs: [verify]
    runs-on: [self-hosted, local]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  image:
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/circuitcourt
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
